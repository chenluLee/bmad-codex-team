[workflow]

# Force full route if you want every implementation to use BmadImplementer.
# Leave route selection under normal BMAD control by default.
route = "auto"

implementation_handoff = """
Launch a subagent using agent_type `BmadImplementer` with no prior conversation context (fork_turns="none"), with this prompt:

> Read {spec_file} fully and implement it — the spec is the sole source of truth. Load every file listed in its frontmatter `context:` before you start.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky.

Keep the returned child available for re-engagement during review fixes if the host supports it.
"""

[[workflow.quick_lenses]]
id = "quick"
name = "Quick"
instruction = """
Launch a context-free subagent using agent_type `BmadAcceptanceAuditor` (fork_turns="none") with this prompt:

Read `{spec_file}` and the files its frontmatter `context:` lists. Read repository instruction files (AGENTS.md, CLAUDE.md, or equivalents) at the repository root and in directories touched by the diff. Then read the unified diff at `{diff_file}`.

Report unmet acceptance criteria, broken repository rules, and bugs. Each finding must include location, what goes wrong, and evidence checked against surrounding code. Output a Markdown list of findings only. Do not modify files and do not spawn subagents.
"""

[[workflow.thorough_lenses]]
id = "blind-hunter"
name = "Blind Hunter"
instruction = """
Launch a context-free subagent using agent_type `BmadAdversarialReviewer` (fork_turns="none") with this prompt:

Review the unified diff at `{diff_file}` without reading the story/spec first. Look for what is missing as well as what is wrong. Follow relevant evidence into surrounding code. Output a Markdown list of actionable findings only, each with location and evidence. Do not assign severity. Do not modify files and do not spawn subagents.
"""

[[workflow.thorough_lenses]]
id = "edge-case-hunter"
name = "Edge Case Hunter"
instruction = """
Launch a context-free subagent using agent_type `BmadEdgeCaseReviewer` (fork_turns="none") with this prompt:

Review the unified diff at `{diff_file}` for reachable edge cases and failure paths. Trace surrounding code before concluding. Read `{claims_file}` only after your independent tracing when you need to compare implementation claims. Output a Markdown list of findings only, with location, triggering condition, and evidence. Do not assign severity. Do not modify files and do not spawn subagents.
"""

[[workflow.thorough_lenses]]
id = "verification-gap"
name = "Verification Gap Reviewer"
instruction = """
Launch a context-free subagent using agent_type `BmadVerificationReviewer` (fork_turns="none") with this prompt:

Read the unified diff at `{diff_file}`. Identify behavior changed or promised by this diff, then search/read the relevant tests and test configuration. Report behavior for which a regression would not cause any test to fail. Cite the behavior, the relevant changed location, and the tests/search evidence. Output a Markdown list of findings only. Do not assign severity. Do not modify files and do not spawn subagents.
"""

[[workflow.thorough_lenses]]
id = "intent-alignment"
name = "Intent Alignment Auditor"
instruction = """
Launch a context-free subagent using agent_type `BmadAcceptanceAuditor` (fork_turns="none") with this prompt:

You are an intent-alignment auditor. Here is the verbatim intent this work started from:

{verbatim_intent}

Read the unified diff at `{diff_file}`. Your task is descriptive: enumerate defensible readings of the intent, identify which reading the diff implements, and report where intent and implementation diverge. Do not prescribe unrelated extra work. Return findings as text. Do not modify files and do not spawn subagents.
"""
